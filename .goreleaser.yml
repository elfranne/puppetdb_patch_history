version: 2

builds:
  - env:
      - CGO_ENABLED=0
    main: .
    binary: '{{ .ProjectName }}'
    # goos/goarch/goarm are ignored once targets is set, so only targets is listed.
    targets:
      - linux_386
      - linux_amd64
      - linux_arm_5
      - linux_arm_6
      - linux_arm_7
      - linux_arm64

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_sha512-checksums.txt"
  algorithm: sha512

archives:
  - id: tar
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
